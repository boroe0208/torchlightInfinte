; Data-driven Auto Void sequence. Pipe-separated tokens:
;   Sleep:MS                       -> pause for MS milliseconds
;   Move:X,Y[,Speed]               -> move mouse (speed defaults to DefaultMouseSpeed)
;   Click:Button[,HoldMin-HoldMax] -> press + hold + release (default: Left)
;   Key:Name[,HoldMin-HoldMax]     -> humanized key press (default hold from KeyHold*)
;   Send:Text                      -> raw Send (e.g. {esc})
; This mirrors the original hardcoded routine so behavior is unchanged.
[AutoVoidRoutine]
Steps=Sleep:1000|Move:900,400|Sleep:550|Click:Left|Sleep:550|Move:900,780|Sleep:550|Click:Left|Sleep:550|Move:970,780|Sleep:550|Click:Left|Sleep:4000|Send:{esc}|Sleep:1000|Move:970,200|Sleep:1000|Key:s|Sleep:27000|Move:970,85|Sleep:1500|Key:s|Sleep:1500|Key:s|Sleep:1500|Key:s|Move:580,135|Key:s|Sleep:1200|Click:Right|Sleep:1000|Move:950,480|Key:s|Sleep:2500|Key:b|Sleep:3000|Click:Right|Sleep:6900|Click:Right

